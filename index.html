<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trilhas UCS</title>

    <!-- Mapbox GL JS (mapa + cálculo de rota) -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>

    <!-- TensorFlow.js + modelo do Teachable Machine (reconhecimento de imagem) -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>

    <!-- Firebase (banco de dados do álbum de figurinhas) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">

        <!-- ===================== HEADER ===================== -->
        <header class="app-header">
            <h1>Trilhas UCS</h1>
            <span id="user-status" class="user-status">conectando…</span>
        </header>

        <!-- ===================== TELA: MAPA ===================== -->
        <section id="screen-mapa" class="screen active">
            <div class="search-bar">
                <input id="destino-input" type="text" placeholder="Para onde você vai?">
                <button id="btn-buscar-rota">Buscar rota</button>
            </div>

            <div id="mapa" class="mapa-container"></div>

            <div class="bottom-sheet" id="rota-info" hidden>
                <p><strong id="rota-distancia">--</strong> · <span id="rota-tempo">--</span></p>
                <button id="btn-iniciar-trajeto">Iniciar trajeto</button>
            </div>
        </section>

        <!-- ===================== TELA: ROTA (navegação ativa) ===================== -->
        <section id="screen-rota" class="screen">
            <div class="nav-instrucao">
                <div id="nav-seta" class="nav-seta">↑</div>
                <p id="nav-distancia">-- m</p>
                <p id="nav-texto">Siga em frente</p>
            </div>

            <label class="voice-toggle">
                <input type="checkbox" id="toggle-guia-voz">
                Guia por voz ativo
            </label>

            <button id="btn-cancelar-trajeto">Cancelar trajeto</button>
        </section>

        <!-- ===================== TELA: ÁLBUM ===================== -->
        <section id="screen-album" class="screen">
            <h2>Álbum de figurinhas</h2>
            <p id="album-progresso">0/30 desbloqueadas</p>
            <div id="album-grid" class="album-grid"></div>
        </section>

        <!-- ===================== TELA: SCANNER ===================== -->
        <section id="screen-scanner" class="screen">
            <div class="scanner-viewfinder">
                <video id="scanner-video" autoplay playsinline muted></video>
                <canvas id="scanner-canvas" hidden></canvas>
            </div>
            <button id="btn-escanear">Escanear obra de arte</button>
            <p id="scanner-resultado"></p>
        </section>

        <!-- ===================== NAV INFERIOR ===================== -->
        <nav class="tab-bar">
            <button class="tab-btn active" data-screen="mapa">Mapa</button>
            <button class="tab-btn" data-screen="rota">Rota</button>
            <button class="tab-btn" data-screen="album">Álbum</button>
            <button class="tab-btn" data-screen="scanner">Scanner</button>
        </nav>

    </div>

    <script src="app.js"></script>
</body>
</html>
